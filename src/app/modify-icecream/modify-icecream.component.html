<form [formGroup]="IcecreamList" (ngSubmit)="onSubmit()">

  <div class="form-group">
    <label for="id">ID</label>
    <input type="text" id="id" formControlName="id" appHighlightOnFocus [color]="'yellow'"/>
  </div>

  <div class="form-group">
    <label for="flavour">Flavour</label>
    <input type="text" id="flavour" formControlName="flavour" appHighlightOnFocus [color]="'yellow'"/>
  </div>

  <div class="form-group">
    <label for="brand">Brand</label>
    <input type="text" id="brand" formControlName="brand" appHighlightOnFocus [color]="'yellow'"/>
  </div>

  <div class="form-group">
    <label for="price">Price</label>
    <input type="text" id="price" formControlName="price" appHighlightOnFocus [color]="'yellow'"/>
  </div>

  <div class="form-group">
    <label for="toppings">Toppings</label>
    <input type="checkbox" id="toppings" formControlName="toppings" />
  </div>

  <button type="submit">Submit</button>
  <button type="button" (click)="onDelete()">Delete</button>
  <button type="button" (click)="navigateToIcecreamList()">Back to list</button>
</form>
